<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>game explanation · dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap wide">
  <div class="topbar">
    <div><div class="eyebrow">openhouse · admin</div><h1>game explanation dashboard</h1><div class="tagline">choose to be better</div></div>
    <div class="sp"></div>
    <button class="ghost" id="refresh" style="display:none">refresh</button>
    <button class="ghost" id="signout" style="display:none">sign out</button>
  </div>
  <div id="root"></div>
</div>
<script src="games-data.js"></script>
<script>
const TK='oh_explain_token';
const root=document.getElementById('root');
const API=(window.location.protocol==='file:'||window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1')?'http://localhost:8000':'';
let ALL=[], TRAINEES=[], ACTIVE_TAB='responses', GAME_FILTER='', TRAINEE_FILTER='', CATEGORY_FILTER='';

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}
function sect(title,inner){return '<div class="section"><div class="section-title">'+title+'</div>'+inner+'</div>';}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }

// word-level diff: highlights words in `text` that weren't in `original` (LCS-based)
function diffHighlight(original, text){
  const a=original.trim().split(/\s+/), b=text.trim().split(/\s+/);
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0, out=[];
  while(i<m && j<n){
    if(a[i]===b[j]){ out.push(esc(b[j])); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]) i++;
    else { out.push('<mark class="edit-mark">'+esc(b[j])+'</mark>'); j++; }
  }
  while(j<n){ out.push('<mark class="edit-mark">'+esc(b[j])+'</mark>'); j++; }
  return out.join(' ');
}

function loginView(msg){
  document.getElementById('refresh').style.display='none';
  document.getElementById('signout').style.display='none';
  root.innerHTML='';
  const c=document.createElement('div'); c.className='card'; c.style.maxWidth='400px'; c.style.margin='10px auto';
  c.innerHTML='<div style="font-weight:800;font-size:18px;margin-bottom:2px">sign in</div><div class="muted" style="font-size:13px;margin-bottom:12px">admin access</div>';
  const em=document.createElement('input'); em.placeholder='email';
  const pw=document.createElement('input'); pw.type='password'; pw.placeholder='password';
  const er=document.createElement('div'); er.className='err'; if(msg){er.textContent=msg;er.style.display='block';}
  const b=document.createElement('button'); b.className='btn'; b.style.marginTop='8px'; b.style.width='100%'; b.textContent='sign in →';
  async function go(){
    b.disabled=true;b.textContent='signing in…';
    try{
      const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});
      if(!r.ok) throw new Error('Wrong email or password.');
      const d=await r.json(); localStorage.setItem(TK,d.token); load();
    }catch(e){ er.textContent=e.message; er.style.display='block'; b.disabled=false; b.textContent='sign in →'; }
  }
  b.onclick=go; pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  c.append(em,pw,er,b); root.appendChild(c);
}

function scoreTotal(r){ const s=r.scores||{}; return ['age_appropriateness','clarity','gameplay_accuracy','challenge_accuracy','genuine'].reduce((n,k)=>n+(s[k]?1:0),0); }

function summaryStats(list){
  const n=list.length;
  if(!n) return {n:0};
  const avg=(list.reduce((sum,r)=>sum+scoreTotal(r),0)/n);
  const pct=(key)=>Math.round(100*list.filter(r=>(r.scores||{})[key]).length/n);
  return { n, avg:avg.toFixed(1), age:pct('age_appropriateness'), clarity:pct('clarity'), gameplay:pct('gameplay_accuracy'), challenge:pct('challenge_accuracy'), genuine:pct('genuine') };
}

function byGameTable(list){
  const groups={};
  list.forEach(r=>{ const k=r.game_name||'(unknown)'; (groups[k]=groups[k]||[]).push(r); });
  const keys=Object.keys(groups).sort();
  if(!keys.length) return '<div class="muted" style="font-size:13px;padding:8px 0">No data.</div>';
  let html='<div class="table-wrap"><table class="sum-table"><thead><tr><th>Game</th><th>checks</th><th>avg score</th></tr></thead><tbody>';
  keys.forEach(k=>{
    const obs=groups[k];
    const avg=(obs.reduce((s,r)=>s+scoreTotal(r),0)/obs.length).toFixed(1);
    html+='<tr><td><b>'+esc(k)+'</b></td><td>'+obs.length+'</td><td>'+avg+' / 5</td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

// first (oldest) record per trainee_phone+game_id, computed against the FULL
// dataset so filtering the visible list never changes what counts as a re-attempt
function firstAttemptIds(){
  const earliest={};
  ALL.forEach(r=>{
    const key=(r.trainee_phone||r.trainee_name||'')+'::'+r.game_id;
    if(!earliest[key] || (r.received_at||'')<(earliest[key].received_at||'')) earliest[key]=r;
  });
  return new Set(Object.values(earliest).map(r=>r.id));
}

function recordsView(list){
  if(!list.length) return '<div class="empty">No game explanations match this filter.</div>';
  const sorted=[...list].sort((a,b)=>(b.received_at||'').localeCompare(a.received_at||''));
  const firstIds=firstAttemptIds();
  const scoreLabels={age_appropriateness:'age fit',clarity:'clarity',gameplay_accuracy:'gameplay accuracy',challenge_accuracy:'challenge accuracy',genuine:'genuine'};
  return sorted.map((r,idx)=>{
    const s=r.scores||{};
    const total=scoreTotal(r);
    const uid='expl-'+idx+'-'+(r.id||'');
    const isReattempt=r.id && !firstIds.has(r.id);
    let html='<div class="record">';
    html+='<div class="record-head">';
    html+='<span style="font-weight:800;font-size:15px">'+esc(r.trainee_name||'(unnamed trainee)')+'</span>';
    html+='<span class="pill coral">'+esc(r.game_name||'')+'</span>';
    html+='<span class="pill teal">ages '+esc(r.age_band||'?')+'</span>';
    if(isReattempt) html+='<span class="pill" style="background:#FDE9C8;color:#8a5a00;border-color:transparent">↻ re-attempt</span>';
    if(r.category) html+='<span class="pill">'+esc(r.category)+'</span>';
    if(r.cohort) html+='<span class="pill">'+fmtDate(r.cohort)+'</span>';
    html+='<span class="muted" style="font-size:12px;margin-left:auto">'+esc(r.received_at||'')+'</span>';
    html+='</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">';
    ['age_appropriateness','clarity','gameplay_accuracy','challenge_accuracy','genuine'].forEach(k=>{
      const ok=!!s[k];
      html+='<span class="'+(ok?'yn-yes':'yn-no')+'" style="font-size:11px">'+(ok?'✓':'✗')+' '+scoreLabels[k]+'</span>';
    });
    html+='<span class="pill" style="margin-left:4px">'+total+'/5</span>';
    html+='</div>';
    if(r.reasoning) html+='<div class="txt"><span class="lab">scoring notes</span>'+esc(r.reasoning)+'</div>';
    if(r.suggestion) html+='<div class="txt" style="background:var(--coral-tint)"><span class="lab">🎯 suggestion</span>'+esc(r.suggestion)+'</div>';
    if(r.new_idea) html+='<div class="txt" style="background:var(--teal-tint)"><span class="lab">💡 new idea</span>'+esc(r.new_idea)+'</div>';
    html+='<button class="ghost" style="margin-top:4px" onclick="const t=document.getElementById(\''+uid+'\');t.style.display=t.style.display===\'none\'?\'block\':\'none\'">view transcript</button>';
    html+='<div id="'+uid+'" style="display:none;margin-top:10px">';
    (r.history||[]).forEach(turn=>{
      const who=turn.role==='trainee'?(r.trainee_name||'trainee'):'Housie';
      const body=(turn.role==='trainee' && turn.original) ? diffHighlight(turn.original, turn.text||'') : esc(turn.text||'');
      html+='<div class="txt"><span class="lab">'+esc(who)+(turn.original?' <span style="font-weight:600;text-transform:none;color:var(--muted)">(edited — highlighted)</span>':'')+'</span>'+body+'</div>';
    });
    html+='</div>';
    html+='</div>';
    return html;
  }).join('');
}

function newIdeasView(list){
  const withIdeas=list.filter(r=>r.new_idea);
  if(!withIdeas.length) return '<div class="muted" style="font-size:13px;padding:8px 0">No new ideas captured yet.</div>';
  const sorted=[...withIdeas].sort((a,b)=>(b.received_at||'').localeCompare(a.received_at||''));
  return sorted.map(r=>'<div class="txt" style="background:var(--teal-tint)"><span class="lab">'+esc(r.trainee_name||'?')+' · '+esc(r.game_name||'')+'</span>'+esc(r.new_idea)+'</div>').join('');
}

function responsesTab(){
  const games=[...new Set(ALL.map(r=>r.game_name).filter(Boolean))].sort();
  const trainees=[...new Set(ALL.map(r=>r.trainee_name).filter(Boolean))].sort();
  const categories=[...new Set(ALL.map(r=>r.category).filter(Boolean))].sort();

  const filterRow=document.createElement('div'); filterRow.className='filters';
  filterRow.innerHTML='<span style="font-weight:800;font-size:13px;color:var(--teal)">Filter</span>'
    +'<select id="game-select"><option value="">All games</option>'+games.map(g=>'<option value="'+esc(g)+'"'+(g===GAME_FILTER?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select>'
    +'<select id="trainee-select"><option value="">All trainees</option>'+trainees.map(t=>'<option value="'+esc(t)+'"'+(t===TRAINEE_FILTER?' selected':'')+'>'+esc(t)+'</option>').join('')+'</select>'
    +(categories.length?'<select id="category-select"><option value="">All categories</option>'+categories.map(c=>'<option value="'+esc(c)+'"'+(c===CATEGORY_FILTER?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select>':'');
  root.appendChild(filterRow);

  const filtered=ALL.filter(r=>(!GAME_FILTER||r.game_name===GAME_FILTER)&&(!TRAINEE_FILTER||r.trainee_name===TRAINEE_FILTER)&&(!CATEGORY_FILTER||r.category===CATEGORY_FILTER));
  const stats=summaryStats(filtered);

  const card=document.createElement('div'); card.className='card';
  let html='';
  if(stats.n){
    html+='<div class="stat-row">'
      +'<div class="stat"><div class="n">'+stats.n+'</div><div class="l">checks</div></div>'
      +'<div class="stat"><div class="n">'+stats.avg+' / 5</div><div class="l">avg score</div></div>'
      +'<div class="stat"><div class="n">'+stats.age+'%</div><div class="l">age fit</div></div>'
      +'<div class="stat"><div class="n">'+stats.clarity+'%</div><div class="l">clarity</div></div>'
      +'<div class="stat"><div class="n">'+stats.gameplay+'%</div><div class="l">gameplay accuracy</div></div>'
      +'<div class="stat"><div class="n">'+stats.challenge+'%</div><div class="l">challenge accuracy</div></div>'
      +'<div class="stat"><div class="n">'+stats.genuine+'%</div><div class="l">genuine</div></div>'
      +'</div>';
  }
  html+=sect('New ideas from trainees',newIdeasView(filtered));
  html+=sect('By game',byGameTable(filtered));
  html+=sect('All checks — '+filtered.length,recordsView(filtered));
  card.innerHTML=html;
  root.appendChild(card);

  const gs=document.getElementById('game-select');
  if(gs) gs.onchange=()=>{ GAME_FILTER=gs.value; render(); };
  const ts=document.getElementById('trainee-select');
  if(ts) ts.onchange=()=>{ TRAINEE_FILTER=ts.value; render(); };
  const cs=document.getElementById('category-select');
  if(cs) cs.onchange=()=>{ CATEGORY_FILTER=cs.value; render(); };
}

function categoryGameCount(category){
  return (window.GAMES||[]).filter(g=>g.category===category).length;
}

function traineesTab(){
  const formCard=document.createElement('div'); formCard.className='card';
  formCard.innerHTML='<div style="font-weight:800;font-size:16px;margin-bottom:10px">add a trainee</div>';
  const nm=document.createElement('input'); nm.placeholder='name';
  const ph=document.createElement('input'); ph.placeholder='phone number'; ph.type='tel';
  const pin=document.createElement('input'); pin.placeholder='4-digit PIN they will log in with';
  const cat=document.createElement('select');
  ['art-design','public-speaking','robotics','music','chess'].forEach(c=>{ const o=document.createElement('option'); o.value=c; o.textContent=c; cat.appendChild(o); });
  const cohLabel=document.createElement('div'); cohLabel.className='muted'; cohLabel.style.cssText='font-size:12px;font-weight:700;margin:2px 0 4px';
  cohLabel.textContent='cohort start date';
  const coh=document.createElement('input'); coh.type='date';
  const er=document.createElement('div'); er.className='err';
  const addBtn=document.createElement('button'); addBtn.className='btn'; addBtn.style.width='100%'; addBtn.textContent='add trainee';
  addBtn.onclick=async()=>{
    if(!nm.value.trim()||!ph.value.trim()||!pin.value.trim()){ er.textContent='name, phone and PIN are required'; er.style.display='block'; return; }
    addBtn.disabled=true; addBtn.textContent='adding…';
    try{
      const r=await fetch(API+'/api/admin/trainees',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},{'Authorization':'Bearer '+localStorage.getItem(TK)}),
        body:JSON.stringify({name:nm.value.trim(),phone:ph.value.trim(),pin:pin.value.trim(),category:cat.value,cohort:coh.value.trim()})});
      if(!r.ok){ const d=await r.json(); throw new Error(d.detail||'could not add trainee'); }
      nm.value=''; ph.value=''; pin.value=''; coh.value=''; er.style.display='none';
      await loadTrainees(); render();
    }catch(e){ er.textContent=e.message; er.style.display='block'; }
    addBtn.disabled=false; addBtn.textContent='add trainee';
  };
  formCard.append(nm,ph,pin,cat,cohLabel,coh,er,addBtn);
  root.appendChild(formCard);

  const listCard=document.createElement('div'); listCard.className='card';
  let html='<div style="font-weight:800;font-size:16px;margin-bottom:10px">trainees — '+TRAINEES.length+'</div>';
  if(!TRAINEES.length){
    html+='<div class="empty">No trainees added yet.</div>';
  } else {
    html+='<div class="table-wrap"><table class="sum-table"><thead><tr><th>Name</th><th>Phone</th><th>Category</th><th>Cohort</th><th>Progress</th><th>Assessment</th></tr></thead><tbody>';
    TRAINEES.forEach(t=>{
      const total=categoryGameCount(t.category);
      const done=new Set(ALL.filter(r=>r.trainee_phone===t.phone && r.category===t.category).map(r=>r.game_id)).size;
      html+='<tr><td><b>'+esc(t.name)+'</b></td><td>'+esc(t.phone)+'</td><td>'+esc(t.category)+'</td><td>'+fmtDate(t.cohort)+'</td>'
        +'<td>'+(total?done+' / '+total:'no games yet')+'</td>'
        +'<td><button class="ghost" data-approve-phone="'+esc(t.phone)+'" data-approve-next="'+(t.approved?'false':'true')+'" style="'+(t.approved?'background:var(--sage-tint);color:var(--sage);border-color:transparent':'')+'">'+(t.approved?'✓ approved':'approve download')+'</button></td></tr>';
    });
    html+='</tbody></table></div>';
  }
  listCard.innerHTML=html;
  root.appendChild(listCard);

  listCard.querySelectorAll('[data-approve-phone]').forEach(btn=>{
    btn.onclick=async()=>{
      btn.disabled=true;
      try{
        await fetch(API+'/api/admin/trainees/approve',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},{'Authorization':'Bearer '+localStorage.getItem(TK)}),
          body:JSON.stringify({phone:btn.getAttribute('data-approve-phone'), approved:btn.getAttribute('data-approve-next')==='true'})});
        await loadTrainees(); render();
      }catch(e){ btn.disabled=false; }
    };
  });
}

function accuracyTab(){
  const card=document.createElement('div'); card.className='card';
  let html='<div style="font-weight:800;font-size:16px;margin-bottom:10px">accuracy scores by trainee</div>'
    +'<div class="muted" style="font-size:13px;margin-bottom:12px">gameplay accuracy and challenge (easier/harder) accuracy, per trainee, across every recorded attempt</div>';
  const names=[...new Set(ALL.map(r=>r.trainee_name).filter(Boolean))].sort();
  if(!names.length){
    html+='<div class="empty">No data yet.</div>';
  } else {
    html+='<div class="table-wrap"><table class="sum-table"><thead><tr><th>Trainee</th><th>Category</th><th>checks</th>'
      +'<th>gameplay accuracy</th><th>challenge accuracy</th><th>overall accuracy</th></tr></thead><tbody>';
    names.forEach(name=>{
      const recs=ALL.filter(r=>r.trainee_name===name);
      const cat=recs[0].category||'—';
      const pct=(key)=>{ const scored=recs.filter(r=>(r.scores||{})[key]!==undefined); return scored.length?Math.round(100*scored.filter(r=>r.scores[key]).length/scored.length):null; };
      const gp=pct('gameplay_accuracy'), ch=pct('challenge_accuracy');
      const overall=(gp!==null && ch!==null)?Math.round((gp+ch)/2):(gp!==null?gp:ch);
      const fmt=v=>v===null?'—':v+'%';
      html+='<tr><td><b>'+esc(name)+'</b></td><td>'+esc(cat)+'</td><td>'+recs.length+'</td>'
        +'<td>'+ynBadge(gp)+'</td><td>'+ynBadge(ch)+'</td><td>'+ynBadge(overall)+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  card.innerHTML=html;
  root.appendChild(card);
}
function ynBadge(pct){
  if(pct===null||pct===undefined) return '<span class="yn-pct">—</span>';
  const cls=pct>=70?'yn-yes':pct>=40?'yn-no':'yn-no';
  return '<span class="'+cls+'">'+pct+'%</span>';
}

function render(){
  document.getElementById('refresh').style.display='inline-block';
  document.getElementById('signout').style.display='inline-block';
  root.innerHTML='';

  const tabBar=document.createElement('div'); tabBar.className='tabs';
  [{id:'responses',label:'Responses'},{id:'trainees',label:'Trainees'},{id:'accuracy',label:'Accuracy'}].forEach(t=>{
    const b=document.createElement('button'); b.className='tab'+(ACTIVE_TAB===t.id?' active':''); b.textContent=t.label;
    b.onclick=()=>{ ACTIVE_TAB=t.id; render(); };
    tabBar.appendChild(b);
  });
  root.appendChild(tabBar);

  if(ACTIVE_TAB==='trainees'){ traineesTab(); return; }
  if(ACTIVE_TAB==='accuracy'){ accuracyTab(); return; }
  if(!ALL.length){ root.innerHTML+='<div class="empty">No game explanations recorded yet.</div>'; return; }
  responsesTab();
}

async function loadTrainees(){
  const t=localStorage.getItem(TK);
  try{
    const r=await fetch(API+'/api/admin/trainees',{headers:{'Authorization':'Bearer '+t}});
    TRAINEES = r.ok ? await r.json() : [];
  }catch(e){ TRAINEES=[]; }
}

async function load(){
  const t=localStorage.getItem(TK);
  if(!t){ loginView(); return; }
  root.innerHTML='<div class="empty">loading…</div>';
  try{
    const r=await fetch(API+'/api/explanations',{headers:{'Authorization':'Bearer '+t}});
    if(r.status===401){ localStorage.removeItem(TK); loginView('Session expired — sign in again.'); return; }
    ALL=await r.json();
    await loadTrainees();
    render();
  }catch(e){ root.innerHTML='<div class="empty">Could not load — is the server running?</div>'; }
}
document.getElementById('refresh').onclick=load;
document.getElementById('signout').onclick=()=>{localStorage.removeItem(TK);loginView();};
load();
</script>
</body>
</html>
