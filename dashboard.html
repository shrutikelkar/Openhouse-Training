const TK='oh_explain_token';
const root=document.getElementById('root');
const API=(window.location.protocol==='file:'||window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1')?'http://localhost:8000':'';
let ALL=[], TRAINEES=[], ACTIVE_TAB='responses', GAME_FILTER='', TRAINEE_FILTER='', CATEGORY_FILTER='';
let LAST_BULK_ADD_RESULT=null; // survives the re-render that follows a bulk add, so the summary is actually visible

// Safety net: a modal that fails to close for any reason must never be able
// to block the rest of the page (e.g. the tab bar) — Escape always clears it.
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') document.querySelectorAll('.modal-overlay').forEach(o=>o.remove());
});

function syncTraineePicker(){
  const picker=document.getElementById('trainee-picker');
  if(!ALL.length && !TRAINEES.length){ picker.style.display='none'; return; }
  picker.style.display='inline-block';
  const names=[...new Set(ALL.map(r=>r.trainee_name).filter(Boolean).concat(TRAINEES.map(t=>t.name).filter(Boolean)))].sort();
  picker.innerHTML='<option value="">All trainees</option>'+names.map(n=>'<option value="'+esc(n)+'"'+(n===TRAINEE_FILTER?' selected':'')+'>'+esc(n)+'</option>').join('');
  picker.onchange=()=>{ TRAINEE_FILTER=picker.value; render(); };
}

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

    +'<rect x="24" y="46" width="52" height="36" rx="12" fill="url(#bodyG2)"/>'
    +'<circle cx="39" cy="61" r="4.5" fill="#fff"/><circle cx="61" cy="61" r="4.5" fill="#fff"/>'
    +'<circle cx="40" cy="62" r="1.6" fill="#0b6f80"/><circle cx="62" cy="62" r="1.6" fill="#0b6f80"/>'
    +'<path d="M38 70 Q50 80 62 70" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    +'<circle cx="26" cy="63" r="4" fill="#F6B8A0" opacity=".7"/><circle cx="74" cy="63" r="4" fill="#F6B8A0" opacity=".7"/>'

document.getElementById('headerMascot').innerHTML=mascotSVG(44);
function sect(title,inner){return '<div class="section"><div class="section-title">'+title+'</div>'+inner+'</div>';}
function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso); return isNaN(d)?esc(iso):d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}); }

// word-level diff: highlights words in `text` that weren't in `original` (LCS-based)
function diffHighlight(original, text){
  const a=original.trim().split(/\s+/), b=text.trim().split(/\s+/);
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--)
    dp[i][j] = a[i]===b[j] ? dp[i+1][j+1]+1 : Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0, out=[];
  while(i<m && j<n){
    if(a[i]===b[j]){ out.push(esc(b[j])); i++; j++; }
    else if(dp[i+1][j]>=dp[i][j+1]) i++;
    else { out.push('<mark class="edit-mark">'+esc(b[j])+'</mark>'); j++; }
  }
  while(j<n){ out.push('<mark class="edit-mark">'+esc(b[j])+'</mark>'); j++; }
  return out.join(' ');
}

// Mirrors the backend's _genuineness_signal — same tokenizer and longest-common-run
// algorithm — so what's highlighted here is exactly the evidence Housie was given
// when it scored genuine=0, not a separate guess.
function tokenizeWords(text){ return (text||'').toLowerCase().match(/[a-z0-9]+/g)||[]; }
function longestCommonRun(a,b){
  if(!a.length||!b.length) return {len:0, words:[]};
  const m=a.length, n=b.length;
  const dp=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  let bestLen=0, bestEnd=0;
  for(let i=1;i<=m;i++){
    for(let j=1;j<=n;j++){
      if(a[i-1]===b[j-1]){
        dp[i][j]=dp[i-1][j-1]+1;
        if(dp[i][j]>bestLen){ bestLen=dp[i][j]; bestEnd=i; }
      }
    }
  }
  return { len:bestLen, words: bestLen ? a.slice(bestEnd-bestLen,bestEnd) : [] };
}
function referenceTextForGame(gameId){
  const g=(window.GAMES||[]).find(x=>x.id===gameId);
  if(!g) return '';
  return [
    g.goal||'', (g.steps||[]).join(' '), g.easier||'', g.harder||'', g.ends_when||'',
    Object.values(g.difficulty_levels||{}).join(' '),
    (g.variations||[]).map(v=>v.text||'').join(' ')
  ].filter(Boolean).join(' ');
}
// highlights the first occurrence of the matched word-run inside this turn's
// original-cased text; a run spanning two turns just won't be found here and
// is left unhighlighted rather than guessed at
function highlightGenuineMatch(displayText, matchWords){
  if(!matchWords.length) return esc(displayText);
  const pattern=matchWords.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('[^a-zA-Z0-9]+');
  const m=displayText.match(new RegExp(pattern,'i'));
  if(!m) return esc(displayText);
  const idx=m.index, matched=m[0];
  return esc(displayText.slice(0,idx))+'<mark class="genuine-mark">'+esc(matched)+'</mark>'+esc(displayText.slice(idx+matched.length));
}

function loginView(msg){
  document.getElementById('signout').style.display='none';
  document.getElementById('trainee-picker').style.display='none';
  root.innerHTML='';
  const c=document.createElement('div'); c.className='card'; c.style.maxWidth='400px'; c.style.margin='10px auto';
  c.innerHTML='<div style="font-weight:800;font-size:18px;margin-bottom:2px">sign in</div><div class="muted" style="font-size:13px;margin-bottom:12px">admin access</div>';
  const em=document.createElement('input'); em.placeholder='email';
  const pw=document.createElement('input'); pw.type='password'; pw.placeholder='password';
  const er=document.createElement('div'); er.className='err'; if(msg){er.textContent=msg;er.style.display='block';}
  const b=document.createElement('button'); b.className='btn'; b.style.marginTop='8px'; b.style.width='100%'; b.textContent='sign in →';
  async function go(){
    b.disabled=true;b.textContent='signing in…';
    try{
      const r=await fetch(API+'/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em.value,password:pw.value})});
      if(!r.ok) throw new Error('Wrong email or password.');
      const d=await r.json(); localStorage.setItem(TK,d.token); load();
    }catch(e){ er.textContent=e.message; er.style.display='block'; b.disabled=false; b.textContent='sign in →'; }
  }
  b.onclick=go; pw.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  c.append(em,pw,er,b); root.appendChild(c);
  const back=document.createElement('div'); back.style.cssText='text-align:center;margin-top:10px';
  back.innerHTML='<a href="index.html" style="color:var(--teal);font-size:13px;text-decoration:none">← back to Playwise</a>';
  root.appendChild(back);
}

function scoreTotal(r){ const s=r.scores||{}; return ['age_appropriateness','clarity','gameplay_accuracy','challenge_accuracy','genuine'].reduce((n,k)=>n+(s[k]?1:0),0); }

function summaryStats(list){
  const n=list.length;
  if(!n) return {n:0};
  const avg=(list.reduce((sum,r)=>sum+scoreTotal(r),0)/n);
  const pct=(key)=>Math.round(100*list.filter(r=>(r.scores||{})[key]).length/n);
  return { n, avg:avg.toFixed(1), age:pct('age_appropriateness'), clarity:pct('clarity'), gameplay:pct('gameplay_accuracy'), challenge:pct('challenge_accuracy'), genuine:pct('genuine') };
}

function byGameTable(list){
  const groups={};
  list.forEach(r=>{ const k=r.game_name||'(unknown)'; (groups[k]=groups[k]||[]).push(r); });
  const keys=Object.keys(groups).sort();
  if(!keys.length) return '<div class="muted" style="font-size:13px;padding:8px 0">No data.</div>';
  let html='<div class="table-wrap"><table class="sum-table"><thead><tr><th>Game</th><th>checks</th><th>avg score</th></tr></thead><tbody>';
  keys.forEach(k=>{
    const obs=groups[k];
    const avg=(obs.reduce((s,r)=>s+scoreTotal(r),0)/obs.length).toFixed(1);
    html+='<tr><td><b>'+esc(k)+'</b></td><td>'+obs.length+'</td><td>'+avg+' / 5</td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

// first (oldest) record per trainee_name+game_id, computed against the FULL
// dataset so filtering the visible list never changes what counts as a re-attempt.
// Keyed by name (not phone) to match accuracyTab's re-attempt count — a trainee's
// phone can be blank on older records, which would otherwise split one trainee's
// attempts across two keys and undercount re-attempts.
function firstAttemptIds(){
  const earliest={};
  ALL.forEach(r=>{
    const key=(r.trainee_name||'')+'::'+r.game_id;
    if(!earliest[key] || (r.received_at||'')<(earliest[key].received_at||'')) earliest[key]=r;
  });
  return new Set(Object.values(earliest).map(r=>r.id));
}

function recordsView(list){
  if(!list.length) return '<div class="empty">No game explanations match this filter.</div>';
  const sorted=[...list].sort((a,b)=>(b.received_at||'').localeCompare(a.received_at||''));
  const firstIds=firstAttemptIds();
  const scoreLabels={age_appropriateness:'age fit',clarity:'clarity',gameplay_accuracy:'gameplay accuracy',challenge_accuracy:'challenge accuracy',genuine:'genuine'};
  return sorted.map((r,idx)=>{
    const s=r.scores||{};
    const total=scoreTotal(r);
    const uid='expl-'+idx+'-'+(r.id||'');
    const isReattempt=r.id && !firstIds.has(r.id);
    let html='<div class="record">';
    html+='<div class="record-head">';
    html+='<span style="font-weight:800;font-size:15px">'+esc(r.trainee_name||'(unnamed trainee)')+'</span>';
    html+='<span class="pill coral">'+esc(r.game_name||'')+'</span>';
    html+='<span class="pill teal">ages '+esc(r.age_band||'?')+'</span>';
    if(isReattempt) html+='<span class="pill" style="background:#FDE9C8;color:#8a5a00;border-color:transparent">↻ re-attempt</span>';
    if(r.category) html+='<span class="pill">'+esc(r.category)+'</span>';
    if(r.cohort) html+='<span class="pill">'+fmtDate(r.cohort)+'</span>';
    html+='<span class="muted" style="font-size:12px;margin-left:auto">'+esc(r.received_at||'')+'</span>';
    html+='</div>';
    html+='<div style="display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px">';
    ['age_appropriateness','clarity','gameplay_accuracy','challenge_accuracy','genuine'].forEach(k=>{
      const ok=!!s[k];
      html+='<span class="'+(ok?'yn-yes':'yn-no')+'" style="font-size:11px">'+(ok?'✓':'✗')+' '+scoreLabels[k]+'</span>';
    });
    html+='<span class="pill" style="margin-left:4px">'+total+'/5</span>';
    html+='</div>';
    if(r.reasoning) html+='<div class="txt"><span class="lab">admin-only scoring notes</span>'+esc(r.reasoning)+'</div>';
    if(r.strengths) html+='<div class="txt" style="background:var(--sage-tint)"><span class="lab">✅ what they did well</span>'+esc(r.strengths)+'</div>';
    if(r.improvements&&r.improvements.length){
      let imp='<div class="txt" style="background:var(--coral-tint)"><span class="lab">🎯 what to improve</span>';
      r.improvements.forEach(x=>{ imp+='<div style="margin-bottom:6px"><b>'+esc(scoreLabels[x.criterion]||x.criterion||'')+':</b> '+esc(x.reason||'')+(x.fix?' <i>— '+esc(x.fix)+'</i>':'')+'</div>'; });
      html+=imp+'</div>';
    }
    if(r.suggestion) html+='<div class="txt" style="background:var(--coral-tint)"><span class="lab">🎯 suggestion</span>'+esc(r.suggestion)+'</div>';
    if(r.new_idea) html+='<div class="txt" style="background:var(--teal-tint)"><span class="lab">💡 new idea</span>'+esc(r.new_idea)+'</div>';
    html+='<div class="txt" style="background:var(--subtle)" data-comment-record="'+esc(r.id||'')+'">'
      +'<span class="lab">📝 admin comment</span>'
      +'<div class="comment-display">'+(r.admin_comment?esc(r.admin_comment):'<span class="muted">no comment yet</span>')+'</div>'
      +'<textarea class="comment-input" style="display:none;min-height:60px;margin-top:6px">'+esc(r.admin_comment||'')+'</textarea>'
      +'<div style="margin-top:6px;display:flex;gap:6px">'
      +'<button class="ghost comment-edit-btn" style="font-size:12px;padding:5px 11px">'+(r.admin_comment?'✏️ edit':'+ add comment')+'</button>'
      +'<button class="btn comment-save-btn" style="display:none;font-size:12px;padding:5px 11px">save</button>'
      +'<button class="ghost comment-cancel-btn" style="display:none;font-size:12px;padding:5px 11px">cancel</button>'
      +'</div></div>';
    let genuineMatch={len:0, words:[]};
    if(!s.genuine){
      const refTokens=tokenizeWords(referenceTextForGame(r.game_id));
      const traineeTokens=tokenizeWords((r.history||[]).filter(h=>h.role==='trainee').map(h=>h.text||'').join(' '));
      genuineMatch=longestCommonRun(traineeTokens, refTokens);
      if(genuineMatch.len) html+='<div class="txt" style="background:#FADBD8"><span class="lab" style="color:#B3261E">🔴 flagged as not genuine</span>matched '+genuineMatch.len+' words in a row from the reference material — highlighted below in the transcript.</div>';
    }
    html+='<button class="ghost" style="margin-top:4px" onclick="const t=document.getElementById(\''+uid+'\');t.style.display=t.style.display===\'none\'?\'block\':\'none\'">view transcript</button>';
    html+='<div id="'+uid+'" style="display:none;margin-top:10px">';
    (r.history||[]).forEach(turn=>{
      const who=turn.role==='trainee'?(r.trainee_name||'trainee'):'Housie';
      let body;
      if(turn.role==='trainee' && turn.original) body=diffHighlight(turn.original, turn.text||'');
      else if(turn.role==='trainee' && genuineMatch.len) body=highlightGenuineMatch(turn.text||'', genuineMatch.words);
      else body=esc(turn.text||'');
      html+='<div class="txt"><span class="lab">'+esc(who)+(turn.original?' <span style="font-weight:600;text-transform:none;color:var(--muted)">(edited — highlighted)</span>':'')+'</span>'+body+'</div>';
    });
    html+='</div>';
    html+='</div>';
    return html;
  }).join('');
}

function newIdeasView(list){
  const withIdeas=list.filter(r=>r.new_idea);
  if(!withIdeas.length) return '<div class="muted" style="font-size:13px;padding:8px 0">No new ideas captured yet.</div>';
  const sorted=[...withIdeas].sort((a,b)=>(b.received_at||'').localeCompare(a.received_at||''));
  return sorted.map(r=>'<div class="txt" style="background:var(--teal-tint)"><span class="lab">'+esc(r.trainee_name||'?')+' · '+esc(r.game_name||'')+'</span>'+esc(r.new_idea)+'</div>').join('');
}

function csvEscape(v){
  const s=(v==null?'':String(v));
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function downloadRecordsCSV(list){
  const cols=['trainee_name','trainee_phone','game_name','category','cohort','age_band','received_at',
    'age_appropriateness','clarity','gameplay_accuracy','challenge_accuracy','genuine','total_score',
    'strengths','improvements','new_idea','reasoning'];
  const criteriaLabels={age_appropriateness:'Age fit',clarity:'Clarity',gameplay_accuracy:'Gameplay accuracy',challenge_accuracy:'Challenge accuracy',genuine:'Genuine'};
  const rows=list.map(r=>{
    const s=r.scores||{};
    const improvementsStr=(r.improvements||[]).map(x=>(criteriaLabels[x.criterion]||x.criterion)+': '+(x.reason||'')+(x.fix?' | fix: '+x.fix:'')).join(' ;; ');
    const vals={
      trainee_name:r.trainee_name, trainee_phone:r.trainee_phone, game_name:r.game_name, category:r.category,
      cohort:r.cohort, age_band:r.age_band, received_at:r.received_at,
      age_appropriateness:s.age_appropriateness?1:0, clarity:s.clarity?1:0, gameplay_accuracy:s.gameplay_accuracy?1:0,
      challenge_accuracy:s.challenge_accuracy?1:0, genuine:s.genuine?1:0, total_score:scoreTotal(r),
      strengths:r.strengths||'', improvements:improvementsStr, new_idea:r.new_idea||'', reasoning:r.reasoning||''
    };
    return cols.map(c=>csvEscape(vals[c])).join(',');
  });
  const csv=[cols.join(',')].concat(rows).join('\r\n');
  const blob=new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='playwise-checks-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadScoresCSV(){
  const names=[...new Set(ALL.map(r=>r.trainee_name).filter(Boolean))].filter(n=>!TRAINEE_FILTER||n===TRAINEE_FILTER).sort();
  const cols=['trainee_name','category','checks','age_fit_pct','clarity_pct','gameplay_accuracy_pct','challenge_accuracy_pct','genuine_pct','reattempts'];
  const rows=names.map(name=>{
    const recs=ALL.filter(r=>r.trainee_name===name);
    const pct=(key)=>{ const scored=recs.filter(r=>(r.scores||{})[key]!==undefined); return scored.length?Math.round(100*scored.filter(r=>r.scores[key]).length/scored.length):''; };
    const byGame={}; recs.forEach(r=>{ byGame[r.game_id]=(byGame[r.game_id]||0)+1; });
    const reattemptCount=Object.values(byGame).filter(n=>n>1).length;
    const vals={
      trainee_name:name, category:recs[0].category||'', checks:recs.length,
      age_fit_pct:pct('age_appropriateness'), clarity_pct:pct('clarity'), gameplay_accuracy_pct:pct('gameplay_accuracy'),
      challenge_accuracy_pct:pct('challenge_accuracy'), genuine_pct:pct('genuine'), reattempts:reattemptCount
    };
    return cols.map(c=>csvEscape(vals[c])).join(',');
  });
  const csv=[cols.join(',')].concat(rows).join('\r\n');
  const blob=new Blob(['﻿'+csv], {type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;
  a.download='playwise-scores-'+new Date().toISOString().slice(0,10)+'.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function responsesTab(){
  const categories=[...new Set(ALL.map(r=>r.category).filter(Boolean))].sort();
  const games=[...new Set(ALL.filter(r=>!CATEGORY_FILTER||r.category===CATEGORY_FILTER).map(r=>r.game_name).filter(Boolean))].sort();
  if(GAME_FILTER && !games.includes(GAME_FILTER)) GAME_FILTER='';

  const filterRow=document.createElement('div'); filterRow.className='filters';
  filterRow.innerHTML='<span style="font-weight:800;font-size:13px;color:var(--teal)">Filter</span>'
    +(categories.length?'<select id="category-select"><option value="">All categories</option>'+categories.map(c=>'<option value="'+esc(c)+'"'+(c===CATEGORY_FILTER?' selected':'')+'>'+esc(c)+'</option>').join('')+'</select>':'')
    +'<select id="game-select"><option value="">All games</option>'+games.map(g=>'<option value="'+esc(g)+'"'+(g===GAME_FILTER?' selected':'')+'>'+esc(g)+'</option>').join('')+'</select>'
    +(TRAINEE_FILTER?'<span class="pill coral">trainee: '+esc(TRAINEE_FILTER)+' <span style="cursor:pointer" id="clear-trainee-filter">✕</span></span>':'')
    +'<button class="ghost" id="download-csv" style="margin-left:auto">⬇ download CSV</button>';
  root.appendChild(filterRow);

  const filtered=ALL.filter(r=>(!GAME_FILTER||r.game_name===GAME_FILTER)&&(!TRAINEE_FILTER||r.trainee_name===TRAINEE_FILTER)&&(!CATEGORY_FILTER||r.category===CATEGORY_FILTER));
  const stats=summaryStats(filtered);

  const card=document.createElement('div'); card.className='card';
  let html='';
  if(stats.n){
    html+='<div class="stat-row">'
      +'<div class="stat"><div class="n">'+stats.n+'</div><div class="l">checks</div></div>'
      +'<div class="stat"><div class="n">'+stats.avg+' / 5</div><div class="l">avg score</div></div>'
      +'<div class="stat"><div class="n">'+stats.age+'%</div><div class="l">age fit</div></div>'
      +'<div class="stat"><div class="n">'+stats.clarity+'%</div><div class="l">clarity</div></div>'
      +'<div class="stat"><div class="n">'+stats.gameplay+'%</div><div class="l">gameplay accuracy</div></div>'
      +'<div class="stat"><div class="n">'+stats.challenge+'%</div><div class="l">challenge accuracy</div></div>'
      +'<div class="stat"><div class="n">'+stats.genuine+'%</div><div class="l">genuine</div></div>'
      +'</div>';
  }
  html+=sect('New ideas from trainees',newIdeasView(filtered));

function latestPerGameForPhone(phone){
  const byGame={};
  ALL.filter(r=>r.trainee_phone===phone).forEach(r=>{
    const g=r.game_id;
    if(!byGame[g] || (r.received_at||'')>(byGame[g].received_at||'')) byGame[g]=r;
  });
  return Object.values(byGame).sort((a,b)=>(a.received_at||'').localeCompare(b.received_at||''));
}

      if(imps.length){
        html+='<label style="font-size:11px;font-weight:800;text-transform:uppercase;color:var(--coral-dark);display:block;margin-bottom:3px">🎯 what to improve</label>';
        imps.forEach(imp=>{
          const label=CRITERIA_CHART_LABELS[imp.criterion]||imp.criterion||'';
          html+='<div class="review-imp" data-criterion="'+esc(imp.criterion||'')+'" style="margin-bottom:8px;padding:8px;background:var(--subtle);border-radius:9px">'
            +'<div style="font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px">'+esc(label)+'</div>'

  overlay.addEventListener('click', e=>{ if(e.target===overlay) overlay.remove(); });

  document.getElementById('review-approve').onclick=async()=>{
    const approveBtn=document.getElementById('review-approve');
    approveBtn.disabled=true; approveBtn.textContent='saving…';
    try{
      const blocks=Array.from(card.querySelectorAll('.review-game'));
      for(const block of blocks){
        const id=block.getAttribute('data-review-id');
        const strengths=block.querySelector('.review-strengths').value.trim();
        const improvements=Array.from(block.querySelectorAll('.review-imp')).map(impEl=>({
          criterion: impEl.getAttribute('data-criterion'),
          reason: impEl.querySelector('.review-imp-reason').value.trim(),
          fix: impEl.querySelector('.review-imp-fix').value.trim()

      await load();
    }catch(e){
      approveBtn.disabled=false; approveBtn.textContent='save & approve download';
      alert(e.message);
    }

function reattemptsView(){
  const byKey={};
  ALL.filter(r=>!TRAINEE_FILTER||r.trainee_name===TRAINEE_FILTER).forEach(r=>{
    const key=(r.trainee_name||'')+'::'+r.game_id;
    (byKey[key]=byKey[key]||[]).push(r);
  });
  const reattempted=Object.values(byKey).filter(list=>list.length>1);
  if(!reattempted.length) return '<div class="muted" style="font-size:13px;padding:8px 0">No re-attempts recorded yet.</div>';
  let html='<div class="table-wrap"><table class="sum-table"><thead><tr><th>Trainee</th><th>Game</th><th>1st attempt</th><th>2nd attempt</th><th>change</th></tr></thead><tbody>';
  reattempted.forEach(list=>{
    const sorted=[...list].sort((a,b)=>(a.received_at||'').localeCompare(b.received_at||''));
    const first=sorted[0], last=sorted[sorted.length-1];
    const ft=scoreTotal(first), lt=scoreTotal(last);
    const delta=lt-ft;
    const deltaStr=delta>0?('▲ +'+delta):(delta<0?('▼ '+delta):'– no change');
    const deltaColor=delta>0?'var(--sage)':(delta<0?'var(--stop)':'var(--muted)');
    html+='<tr><td><b>'+esc(first.trainee_name||'?')+'</b></td><td>'+esc(first.game_name||first.game_id||'')+'</td>'
      +'<td>'+ft+'/5</td><td>'+lt+'/5</td>'
      +'<td style="color:'+deltaColor+';font-weight:800">'+deltaStr+'</td></tr>';
  });
  html+='</tbody></table></div>';
  return html;
}

function accuracyTab(){
  const card=document.createElement('div'); card.className='card';

    +'<div style="flex:1;min-width:200px"><div style="font-weight:800;font-size:16px">scores by trainee</div>'

  const names=[...new Set(ALL.map(r=>r.trainee_name).filter(Boolean))].filter(n=>!TRAINEE_FILTER||n===TRAINEE_FILTER).sort();
  if(!names.length){
    html+='<div class="empty">'+(TRAINEE_FILTER?'No data yet for '+esc(TRAINEE_FILTER)+'.':'No data yet.')+'</div>';
  } else {
    html+='<div class="table-wrap"><table class="sum-table"><thead><tr><th>Trainee</th><th>Category</th><th>checks</th>'
      +'<th>age fit</th><th>clarity</th><th>gameplay accuracy</th><th>challenge accuracy</th><th>genuine</th><th>re-attempts</th></tr></thead><tbody>';
    names.forEach(name=>{
      const recs=ALL.filter(r=>r.trainee_name===name);
      const cat=recs[0].category||'—';
      const pct=(key)=>{ const scored=recs.filter(r=>(r.scores||{})[key]!==undefined); return scored.length?Math.round(100*scored.filter(r=>r.scores[key]).length/scored.length):null; };
      const byGame={}; recs.forEach(r=>{ byGame[r.game_id]=(byGame[r.game_id]||0)+1; });
      const reattemptCount=Object.values(byGame).filter(n=>n>1).length;
      html+='<tr><td><b>'+esc(name)+'</b></td><td>'+esc(cat)+'</td><td>'+recs.length+'</td>'
        +'<td>'+ynBadge(pct('age_appropriateness'))+'</td>'
        +'<td>'+ynBadge(pct('clarity'))+'</td>'
        +'<td>'+ynBadge(pct('gameplay_accuracy'))+'</td>'
        +'<td>'+ynBadge(pct('challenge_accuracy'))+'</td>'
        +'<td>'+ynBadge(pct('genuine'))+'</td>'
        +'<td>'+(reattemptCount?'<span class="pill" style="background:#FDE9C8;color:#8a5a00;border-color:transparent">↻ '+reattemptCount+'</span>':'<span class="yn-pct">—</span>')+'</td></tr>';
    });
    html+='</tbody></table></div>';
  }
  card.innerHTML=html;
  root.appendChild(card);
  const dlScores=document.getElementById('download-scores-csv');
  if(dlScores) dlScores.onclick=downloadScoresCSV;

  const reCard=document.createElement('div'); reCard.className='card';
  reCard.innerHTML=sect('Re-attempts — before vs after', reattemptsView());
  root.appendChild(reCard);
}
// --- Charts ---
// Fixed hue order (validated categorical set, adjacent-bar safe both modes) —
// never reassigned/cycled, so the same criterion is always the same color
// across the combined chart and every per-game small multiple.
const CRITERIA_KEYS=['age_appropriateness','clarity','gameplay_accuracy','challenge_accuracy','genuine'];
const CRITERIA_CHART_LABELS={age_appropriateness:'Age fit',clarity:'Clarity',gameplay_accuracy:'Gameplay accuracy',challenge_accuracy:'Challenge accuracy',genuine:'Genuine'};
const CHART_COLORS={age_appropriateness:'#2a78d6',clarity:'#eb6834',gameplay_accuracy:'#1baf7a',challenge_accuracy:'#eda100',genuine:'#e87ba4'};

function pctFor(list,key){
  const scored=list.filter(r=>(r.scores||{})[key]!==undefined);
  return scored.length?Math.round(100*scored.filter(r=>r.scores[key]).length/scored.length):0;
}

function chartLegend(){
  let html='<div style="display:flex;flex-wrap:wrap;gap:14px;margin-bottom:16px">';
  CRITERIA_KEYS.forEach(k=>{
    html+='<span style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)">'
      +'<span style="width:12px;height:12px;border-radius:3px;background:'+CHART_COLORS[k]+';display:inline-block;flex:none"></span>'+esc(CRITERIA_CHART_LABELS[k])+'</span>';
  });
  html+='</div>';
  return html;
}

// Horizontal bar chart, small-multiples-safe: fixed category order/color,
// gridlines at 0/25/50/75/100, value labelled at the bar tip (text never
// carries the series color — labels stay in ink/muted tokens).
function barChartSVG(values,opts){
  opts=opts||{};
  const w=opts.width||440, barH=18, gap=12, leftPad=132, rightPad=44, topPad=6;
  const chartW=w-leftPad-rightPad;
  const h=topPad*2+values.length*(barH+gap)-gap;
  let svg='<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="max-width:'+w+'px;display:block;overflow:visible">';
  [0,25,50,75,100].forEach(p=>{
    const x=leftPad+chartW*p/100;
    svg+='<line x1="'+x+'" y1="0" x2="'+x+'" y2="'+h+'" stroke="#e7e0d4" stroke-width="1"/>';
  });
  values.forEach((v,i)=>{
    const y=topPad+i*(barH+gap);
    const barW=Math.max(2,chartW*v.pct/100);
    svg+='<text x="'+(leftPad-10)+'" y="'+(y+barH/2+4)+'" text-anchor="end" font-size="11.5px" fill="#6b675f">'+esc(v.label)+'</text>';
    svg+='<rect x="'+leftPad+'" y="'+y+'" width="'+barW+'" height="'+barH+'" rx="4" fill="'+v.color+'"/>';
    svg+='<text x="'+(leftPad+barW+8)+'" y="'+(y+barH/2+4)+'" font-size="12px" font-weight="800" fill="#2C2B28">'+v.pct+'%</text>';
  });
  svg+='</svg>';
  return svg;
}

function chartsTab(){
  const filteredAll=ALL.filter(r=>!TRAINEE_FILTER||r.trainee_name===TRAINEE_FILTER);
  const card=document.createElement('div'); card.className='card';
  let html='<div style="font-weight:800;font-size:16px;margin-bottom:4px">score charts</div>'
    +'<div class="muted" style="font-size:13px;margin-bottom:14px">pass rate per criterion — combined across all games, and broken down by game'+(TRAINEE_FILTER?' — filtered to '+esc(TRAINEE_FILTER):'')+'</div>'
    +chartLegend();

  if(!filteredAll.length){
    html+='<div class="empty">No data yet'+(TRAINEE_FILTER?' for '+esc(TRAINEE_FILTER):'')+'.</div>';
    card.innerHTML=html;
    root.appendChild(card);
    return;
  }

  const combinedValues=CRITERIA_KEYS.map(k=>({key:k,label:CRITERIA_CHART_LABELS[k],pct:pctFor(filteredAll,k),color:CHART_COLORS[k]}));
  html+=sect('All games combined — '+filteredAll.length+' checks',barChartSVG(combinedValues,{width:460}));
  card.innerHTML=html;
  root.appendChild(card);

  const gameNames={};
  filteredAll.forEach(r=>{ if(r.game_id) gameNames[r.game_id]=r.game_name||r.game_id; });
  const gameIds=Object.keys(gameNames).sort((a,b)=>gameNames[a].localeCompare(gameNames[b]));
  if(gameIds.length){
    const gridCard=document.createElement('div'); gridCard.className='card';
    let gh='<div class="section-title" style="margin-bottom:14px">by game</div>'
      +'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:22px">';
    gameIds.forEach(gid=>{
      const list=filteredAll.filter(r=>r.game_id===gid);
      const values=CRITERIA_KEYS.map(k=>({key:k,label:CRITERIA_CHART_LABELS[k],pct:pctFor(list,k),color:CHART_COLORS[k]}));
      gh+='<div><div style="font-weight:800;font-size:13.5px;margin-bottom:8px">'+esc(gameNames[gid])+' <span class="muted" style="font-weight:600;font-size:11.5px">('+list.length+' check'+(list.length!==1?'s':'')+')</span></div>'
        +barChartSVG(values,{width:340})+'</div>';
    });
    gh+='</div>';
    gridCard.innerHTML=gh;
    root.appendChild(gridCard);
  }
}

function ynBadge(pct){
  if(pct===null||pct===undefined) return '<span class="yn-pct">—</span>';
  const cls=pct>=70?'yn-yes':pct>=40?'yn-no':'yn-no';
  return '<span class="'+cls+'">'+pct+'%</span>';
}

function render(){
  document.getElementById('signout').style.display='inline-block';
  syncTraineePicker();
  root.innerHTML='';

  const tabBar=document.createElement('div'); tabBar.className='tabs';
  [{id:'responses',label:'Responses'},{id:'trainees',label:'Trainees'},{id:'accuracy',label:'Scores'},{id:'charts',label:'Charts'}].forEach(t=>{
    const b=document.createElement('button'); b.className='tab'+(ACTIVE_TAB===t.id?' active':''); b.textContent=t.label;
    b.onclick=()=>{ ACTIVE_TAB=t.id; render(); };
    tabBar.appendChild(b);
  });
  root.appendChild(tabBar);

  if(ACTIVE_TAB==='trainees'){ traineesTab(); return; }
  if(ACTIVE_TAB==='accuracy'){ accuracyTab(); return; }
  if(ACTIVE_TAB==='charts'){ chartsTab(); return; }
  if(!ALL.length){
    const empty=document.createElement('div'); empty.className='empty'; empty.textContent='No game explanations recorded yet.';
    root.appendChild(empty);
    return;
  }
  responsesTab();
}

async function loadTrainees(){
  // On failure, leave TRAINEES exactly as it was — a transient error here must
  // never silently wipe the admin's already-loaded list.
  const t=localStorage.getItem(TK);
  try{
    const r=await fetch(API+'/api/admin/trainees',{headers:{'Authorization':'Bearer '+t}});
    if(r.ok) TRAINEES=await r.json();
  }catch(e){}
}

async function load(){
  const t=localStorage.getItem(TK);
  if(!t){ loginView(); return; }
  root.innerHTML='<div class="empty">loading…</div>';
  try{
    const r=await fetch(API+'/api/explanations',{headers:{'Authorization':'Bearer '+t}});
    if(r.status===401){ localStorage.removeItem(TK); loginView('Session expired — sign in again.'); return; }
    ALL=await r.json();
    await loadTrainees();
    render();
  }catch(e){ root.innerHTML='<div class="empty">Could not load — is the server running?</div>'; }
}
document.getElementById('signout').onclick=()=>{localStorage.removeItem(TK);loginView();};
load();
</script>
</body>
