function speak(text){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window) || !text){ resolve(); return; }
    const u=new SpeechSynthesisUtterance(text);
    u.rate=0.98; u.onend=resolve; u.onerror=resolve;
    if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
      window.speechSynthesis.cancel();
      setTimeout(()=>window.speechSynthesis.speak(u), 150);
    } else {
      window.speechSynthesis.speak(u);
    }
  });
}

// MediaRecorder's native output (webm/opus in Chrome, ogg/opus in Firefox, mp4/aac
// in Safari) isn't a MIME type Gemini's audio understanding accepts — only wav,
// mp3, aiff, aac, ogg and flac are. Rather than gamble on undocumented leniency,
// decode whatever the browser recorded and re-encode it as 16kHz mono WAV, a
// format every browser can produce and Gemini is guaranteed to accept.
async function blobToWavBase64(blob){
  const arrayBuffer=await blob.arrayBuffer();
  const AudioCtx=window.AudioContext||window.webkitAudioContext;
  const decodeCtx=new AudioCtx();
  const decoded=await decodeCtx.decodeAudioData(arrayBuffer);
  decodeCtx.close();
  const targetRate=16000;
  const offlineCtx=new OfflineAudioContext(1, Math.ceil(decoded.duration*targetRate), targetRate);
  const source=offlineCtx.createBufferSource();
  source.buffer=decoded;
  source.connect(offlineCtx.destination);
  source.start();
  const resampled=await offlineCtx.startRendering();
  const samples=resampled.getChannelData(0);
  const wavBuffer=new ArrayBuffer(44+samples.length*2);
  const view=new DataView(wavBuffer);
  const writeStr=(offset,str)=>{ for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); };
  writeStr(0,'RIFF'); view.setUint32(4, 36+samples.length*2, true); writeStr(8,'WAVE');
  writeStr(12,'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, targetRate, true);
  view.setUint32(28, targetRate*2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true);
  writeStr(36,'data'); view.setUint32(40, samples.length*2, true);
  for(let i=0, offset=44; i<samples.length; i++, offset+=2){
    const s=Math.max(-1, Math.min(1, samples[i]));
    view.setInt16(offset, s<0 ? s*0x8000 : s*0x7FFF, true);
  }
  let binary=''; const bytes=new Uint8Array(wavBuffer); const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk) binary+=String.fromCharCode.apply(null, bytes.subarray(i, i+chunk));
  return btoa(binary);
}

function scoreTotal(s){ return ['age_appropriateness','clarity','gameplay_accuracy','challenge_accuracy','genuine'].reduce((n,k)=>n+(s[k]?1:0),0); }

function tabBar(active){
  const bar=document.createElement('div'); bar.className='tab-bar';
  const gamesBtn=document.createElement('button'); gamesBtn.className='tab-btn'+(active==='games'?' active':''); gamesBtn.textContent='🎮 games';
  gamesBtn.onclick=()=>{ if(active!=='games') renderChecklist(); };
  bar.appendChild(gamesBtn);
  if(TRAINEE.category==='art-design'){
    const artBtn=document.createElement('button'); artBtn.className='tab-btn'+(active==='artwork'?' active':''); artBtn.textContent='🎨 artwork';
    artBtn.onclick=()=>{ if(active!=='artwork') renderArtwork(); };
    bar.appendChild(artBtn);
  }
  return bar;
}

// latest attempt per game_id (records come back newest-first from the server)
function latestByGame(){
  const map={};
  MY_RECORDS.forEach(r=>{ if(!map[r.game_id]) map[r.game_id]=r; });
  return map;
}
function attemptCountByGame(){
  const counts={};
  MY_RECORDS.forEach(r=>{ counts[r.game_id]=(counts[r.game_id]||0)+1; });
  return counts;
}

async function fetchMyRecords(){
  const r=await fetch(API+'/api/my-explanations',{headers:authHeader()});
  if(r.status===401){ localStorage.removeItem(TK); loginView('Session expired — sign in again.'); return false; }
  MY_RECORDS = r.ok ? await r.json() : [];
  return true;
}

async function fetchMyStatus(){
  try{
    const r=await fetch(API+'/api/trainee/status',{headers:authHeader()});
    if(r.ok){ const d=await r.json(); TRAINEE.approved=!!d.approved; TRAINEE.category=d.category; TRAINEE.cohort=d.cohort; }
  }catch(e){}
}

async function renderChecklist(){
  document.body.classList.remove('login-bg');
  root.innerHTML='<div class="empty">loading…</div>';
  const ok=await fetchMyRecords();
  if(!ok) return;
  await fetchMyStatus();
  const games=categoryGames();
  const latest=latestByGame();
  const attempts=attemptCountByGame();
  const doneCount=games.filter(g=>latest[g.id]).length;

  root.innerHTML='';
  const head=document.createElement('div'); head.className='card';
  const pct=games.length?Math.round(100*doneCount/games.length):0;
  head.innerHTML='<div style="display:flex;align-items:center;gap:14px">'
      +progressRingSVG(pct,64)
      +'<div style="flex:1"><div style="font-weight:800;font-size:18px;margin-bottom:2px">hi, '+esc(TRAINEE.name)+'</div>'
      +'<div class="muted" style="font-size:13px">'+esc(TRAINEE.category)+(TRAINEE.cohort?' · '+esc(TRAINEE.cohort):'')+'</div></div>'
    +'</div>'
    +'<div class="muted" style="font-size:13px;margin-top:10px">'+doneCount+' of '+games.length+' games completed. Every game is required — you can do them in any order. Each game allows one re-attempt.</div>';
  root.appendChild(head);
  root.appendChild(tabBar('games'));

  if(!games.length){
    const empty=document.createElement('div'); empty.className='card empty'; empty.textContent='No games are set up for your category yet — check back soon.';
    root.appendChild(empty);
  }

  function buildGameTile(g){
    const rec=latest[g.id];
    const count=attempts[g.id]||0;
    const canReattempt=rec && count<MAX_ATTEMPTS_PER_GAME;
    const tile=document.createElement('div'); tile.className='game-tile'+(rec?' done':'');
    const img=document.createElement('div'); img.className='game-tile-img';
    const iconSVG=gameIconSVG(g.id, 120);
    if(GAME_PHOTOS[g.id]) img.innerHTML='<img src="'+GAME_PHOTOS[g.id]+'" alt="" style="width:100%;height:100%;object-fit:cover">';
    else if(iconSVG) img.innerHTML='<div style="width:100%;height:100%;display:grid;place-items:center">'+iconSVG+'</div>';
    else img.innerHTML='<div style="width:100%;height:100%;display:grid;place-items:center;font-size:44px">'+gameIcon(g.id)+'</div>';
    const dot=document.createElement('div'); dot.className='check-dot game-tile-badge '+(rec?'done':'pending');
    dot.textContent=rec?'✓':'';
    img.appendChild(dot);
    tile.appendChild(img);
    const body=document.createElement('div'); body.className='game-tile-body';
    body.innerHTML='<div style="font-weight:800;font-size:15px">'+esc(g.name)+'</div>'
      +(rec?'<div class="muted" style="font-size:12.5px">'+scoreTotal(rec.scores)+'/5 · ages '+esc(rec.age_band)+' · attempt '+count+' of '+MAX_ATTEMPTS_PER_GAME+'</div>':'<div class="muted" style="font-size:12.5px">not attempted yet</div>');
    tile.appendChild(body);
    if(!rec || canReattempt){
      const btn=document.createElement('button'); btn.className=(rec?'ghost':'btn'); btn.style.cssText='width:100%;margin-top:8px';
      btn.textContent=rec?'re-attempt':'start →';
      btn.onclick=()=>startGame(g);
      body.appendChild(btn);
    } else {
      const done=document.createElement('span'); done.className='pill'; done.style.cssText='display:block;text-align:center;margin-top:8px';
      done.textContent='both attempts used';
      body.appendChild(done);
    }
    return tile;
  }

  const SECTION_ORDER=['lanyards','roll-call','playground','showtime'];
  const SECTION_LABELS={'roll-call':'Roll Call','playground':'Playground','showtime':'Showtime','lanyards':'Lanyards'};
  const hasSections=games.some(g=>g.section);
  if(hasSections){
    const sections=[...SECTION_ORDER, ...new Set(games.map(g=>g.section).filter(s=>s && !SECTION_ORDER.includes(s)))];
    sections.forEach(sec=>{
      const secGames=games.filter(g=>g.section===sec);
      if(!secGames.length) return;
      const title=document.createElement('div'); title.className='game-section-title'; title.textContent=SECTION_LABELS[sec]||sec;
      root.appendChild(title);
      const grid=document.createElement('div'); grid.className='game-grid';
      secGames.forEach(g=>grid.appendChild(buildGameTile(g)));
      root.appendChild(grid);
    });
    const unsectioned=games.filter(g=>!g.section);
    if(unsectioned.length){
      const grid=document.createElement('div'); grid.className='game-grid';
      unsectioned.forEach(g=>grid.appendChild(buildGameTile(g)));
      root.appendChild(grid);
    }
  } else {
    const grid=document.createElement('div'); grid.className='game-grid';
    games.forEach(g=>grid.appendChild(buildGameTile(g)));
    root.appendChild(grid);
  }

  if(doneCount>0 && !TRAINEE.approved){
    const note=document.createElement('div'); note.className='muted'; note.style.cssText='font-size:12.5px;margin-bottom:10px';
    note.textContent='Your assessment will be available to download once your admin approves it.';
    root.appendChild(note);
  }
  const actions=document.createElement('div'); actions.style.cssText='display:flex;gap:8px;margin-top:4px';
  if(doneCount>0 && TRAINEE.approved){
    const dlBtn=document.createElement('button'); dlBtn.className='ghost'; dlBtn.style.flex='1'; dlBtn.textContent='⬇ download my assessment';
    dlBtn.onclick=()=>downloadAssessmentDocx(dlBtn);
    actions.appendChild(dlBtn);
  }
  const signout=document.createElement('button'); signout.className='ghost'; signout.style.flex='none'; signout.textContent='sign out';
  signout.onclick=()=>{ localStorage.removeItem(TK); localStorage.removeItem('oh_trainee_info'); loginView(); };
  actions.appendChild(signout);
  root.appendChild(actions);
}

function fileToBase64(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result.split(',')[1]);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(file);
  });
}

async function uploadArtworkSlot(ageBand, unit, file, statusEl, btnEl){
  if(file.type!=='image/jpeg' && file.type!=='image/png' && file.type!=='application/pdf'){ statusEl.textContent='please upload a JPG, PNG or PDF file'; statusEl.style.color='#B3261E'; return; }
  if(file.size > 8*1024*1024){ statusEl.textContent='file too large (max 8MB)'; statusEl.style.color='#B3261E'; return; }
  btnEl.disabled=true; const prevText=btnEl.textContent; btnEl.textContent='uploading…';
  statusEl.style.color=''; statusEl.textContent='uploading…';
  try{
    const b64=await fileToBase64(file);
    const r=await fetch(API+'/api/artwork/upload',{
      method:'POST', headers:{'Content-Type':'application/json', ...authHeader()},
      body:JSON.stringify({age_band:ageBand, unit:unit, file:b64, filename:file.name, content_type:file.type||'application/octet-stream'})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.detail||'upload failed');
    MY_ARTWORK=d.artwork;
    renderArtwork();
  }catch(e){
    statusEl.textContent=e.message||'upload failed'; statusEl.style.color='#B3261E';
    btnEl.disabled=false; btnEl.textContent=prevText;
  }
}

const MIC_ERROR_MESSAGES={
  'not-allowed':'microphone access was denied — allow microphone access for this site in your browser settings and try again.',
  'permission-denied':'microphone access was denied — allow microphone access for this site in your browser settings and try again.',
  'no-speech':'didn\'t catch anything — tap the mic and try again.',
  'audio-capture':'no microphone was found — check that one is connected and try again.',
  'network':'a network issue interrupted voice recording — check your connection and try again.'
};
function showMicError(key, customMessage){
  const m=document.getElementById('micErr');
  if(m){ m.textContent=customMessage||MIC_ERROR_MESSAGES[key]||'something went wrong with voice recording — try again.'; m.style.display='block'; }
}
async function toggleListening(){
  if(listening){ stopListening(); return; }
  if(!micSupported()) return;
  const micErr=document.getElementById('micErr'); if(micErr) micErr.style.display='none';
  try{
    mediaStream=await navigator.mediaDevices.getUserMedia({audio:true});
  }catch(e){
    showMicError(e.name==='NotAllowedError'||e.name==='PermissionDeniedError'?'not-allowed':'audio-capture');
    return;
  }
  const audioChunks=[];
  // whatever format the browser records in gets decoded and re-encoded as WAV
  // before upload, so there's no need to request a specific one here
  mediaRecorder=new MediaRecorder(mediaStream);
  mediaRecorder.ondataavailable=(e)=>{ if(e.data && e.data.size>0) audioChunks.push(e.data); };
  mediaRecorder.onstop=async()=>{
    mediaStream.getTracks().forEach(t=>t.stop());
    listening=false;
    const m=document.getElementById('micBtn'); if(m) m.classList.remove('listening');
    const blob=new Blob(audioChunks,{type:mediaRecorder.mimeType||'audio/webm'});
    if(blob.size<400){ showMicError('no-speech'); return; }
    const lt=document.getElementById('liveText'); if(lt) lt.textContent='transcribing…';
    try{
      const b64=await blobToWavBase64(blob);
      const r=await fetch(API+'/api/explain/transcribe',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeader()),
        body:JSON.stringify({audio:b64, mime_type:'audio/wav'})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||'could not transcribe');
      const text=(d.transcript||'').trim();
      if(lt) lt.textContent='';
      if(text){ liveText=text; originalTranscript=text; reviewMode=true; renderConversation(); }
      else showMicError('no-speech');
    }catch(e){
      console.error('transcribe failed:', e);
      if(lt) lt.textContent='';
      showMicError(null, 'could not transcribe your answer — check your connection and try again.');
    }
  };
  mediaRecorder.start();
  listening=true;
  liveText='';
  const lt=document.getElementById('liveText'); if(lt) lt.textContent='🔴 listening… tap the mic again when you\'re done';
  const m=document.getElementById('micBtn'); if(m) m.classList.add('listening');
}
function stopListening(){
  if(mediaRecorder && mediaRecorder.state!=='inactive'){ try{mediaRecorder.stop();}catch(e){} }
  listening=false;
}

async function submitAnswer(rawText, original){
  const text=(rawText||'').trim();
  if(!text) return;
  reviewMode=false;
  const turn={role:'trainee', text};
  if(original && original.trim() && original.trim()!==text) turn.original=original.trim();
  STATE.history.push(turn);
  renderConversation(true);
  try{
    const r=await fetch(API+'/api/explain/turn',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeader()),
      body:JSON.stringify({game:STATE.game, age_band:STATE.ageBand, history:STATE.history})});
    if(r.status===401){ localStorage.removeItem(TK); loginView('Session expired — sign in again.'); return; }
    const d=await r.json();
    if(!r.ok){
      console.error('explain/turn failed:', d.detail||('HTTP '+r.status));
      STATE.history.push({role:'ai', text:'Sorry, something went wrong scoring that — tap the mic and try again.'});
      renderConversation();
      return;
    }
    if(d.action==='final'){
      STATE.finalResult=d;
      renderFinal();
    } else {
      STATE.history.push({role:'ai', text:d.question||('What materials would you need to run '+STATE.game.name+'?')});
      renderConversation();
      await speak(d.question||'');
    }
  }catch(e){
    console.error('explain/turn network error:', e);
    STATE.history.push({role:'ai', text:'(connection error — could not reach the scoring service)'});
    renderConversation();
  }
}

      const r=await fetch(API+'/api/explain/save',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeader()),body:JSON.stringify({
        game_id:game.id, game_name:game.name, age_band:STATE.ageBand, trainee_name:TRAINEE.name,
        history:STATE.history, scores:s, reasoning:STATE.finalResult.reasoning||'', new_idea:STATE.finalResult.new_idea||null,
        strengths:STATE.finalResult.strengths||'', improvements:STATE.finalResult.improvements||[]
      })});
      if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||'could not save'); }
      if(canRedo){ await fetchMyRecords(); startGame(game); }
      else renderChecklist();
    }catch(e){ saveBtn.textContent=e.message||'could not save — try again'; saveBtn.disabled=false; }
  };
  card.appendChild(saveBtn);
  root.appendChild(card);
}

async function downloadAssessmentDocx(btn){
  const orig=btn.textContent;
  btn.disabled=true; btn.textContent='preparing…';
  try{
    const r=await fetch(API+'/api/my-assessment.docx',{headers:authHeader()});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||'could not generate the document'); }
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename="([^"]+)"/);
    a.download=m?m[1]:(TRAINEE.name.replace(/[^a-z0-9]+/gi,'-')+'-assessment.docx');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    btn.textContent=orig;
  }catch(e){
    btn.textContent='could not download — try again';
  }
  btn.disabled=false;
}

const savedInfo=localStorage.getItem('oh_trainee_info');
if(savedInfo){ try{ TRAINEE=JSON.parse(savedInfo); }catch(e){} }
if(!localStorage.getItem(TK)) loginView(); else renderChecklist();
</script>
