<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>game explanation check</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <div class="brand-row">
    <div id="headerMascot" class="mascot"></div>
    <div><div class="eyebrow">openhouse</div><h1>game explanation check</h1><div class="tagline">choose to be better</div></div>
  </div>
  <div id="root"></div>
</div>
<script src="games-data.js"></script>
<script>
const TK='oh_trainee_token';
const root=document.getElementById('root');
const API=(window.location.protocol==='file:'||window.location.hostname==='localhost'||window.location.hostname==='127.0.0.1')?'http://localhost:8000':'';

function esc(s){return (s==null?'':String(s)).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));}

function mascotSVG(size){
  return '<svg viewBox="0 0 100 100" width="'+size+'" height="'+size+'" xmlns="http://www.w3.org/2000/svg">'
    +'<defs>'
      +'<linearGradient id="roofG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#EF5C34"/><stop offset="100%" stop-color="#CE4520"/></linearGradient>'
      +'<linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#12a3ba"/><stop offset="100%" stop-color="#0b6f80"/></linearGradient>'
    +'</defs>'
    +'<rect x="2" y="2" width="96" height="96" rx="26" fill="#FFF7EE"/>'
    +'<polygon points="50,16 86,48 14,48" fill="url(#roofG)"/>'
    +'<circle cx="50" cy="24" r="4.5" fill="#EF5C34"/>'
    +'<rect x="47.5" y="30" width="5" height="10" rx="2" fill="#CE4520"/>'
    +'<rect x="24" y="46" width="52" height="36" rx="12" fill="url(#bodyG)"/>'
    +'<circle cx="39" cy="61" r="4.5" fill="#fff"/><circle cx="61" cy="61" r="4.5" fill="#fff"/>'
    +'<circle cx="40" cy="62" r="1.6" fill="#0b6f80"/><circle cx="62" cy="62" r="1.6" fill="#0b6f80"/>'
    +'<path d="M38 70 Q50 80 62 70" stroke="#fff" stroke-width="3.5" fill="none" stroke-linecap="round"/>'
    +'<circle cx="26" cy="63" r="4" fill="#F6B8A0" opacity=".7"/><circle cx="74" cy="63" r="4" fill="#F6B8A0" opacity=".7"/>'
    +'</svg>';
}

function progressRingSVG(pct, size){
  const r=(size/2)-5, c=2*Math.PI*r, off=c*(1-pct/100);
  return '<div class="progress-ring-wrap"><svg width="'+size+'" height="'+size+'">'
    +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#ecdfd0" stroke-width="6"/>'
    +'<circle cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+r+'" fill="none" stroke="#EF5C34" stroke-width="6" stroke-linecap="round" '
      +'stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" style="transition:stroke-dashoffset .4s"/>'
    +'</svg><div class="pct">'+pct+'%</div></div>';
}
document.getElementById('headerMascot').innerHTML=mascotSVG(48);

let TRAINEE={ name:'', phone:'', category:'', cohort:'', approved:false };
let MY_RECORDS=[];
let STATE={ game:null, ageBand:null, history:[], finalResult:null };
let recognition=null, listening=false, liveText='', reviewMode=false, originalTranscript='';

function authHeader(){ return {'Authorization':'Bearer '+localStorage.getItem(TK)}; }

function loginView(msg){
  root.innerHTML='';
  const hero=document.createElement('div'); hero.className='hero';
  hero.innerHTML='<div class="mascot">'+mascotSVG(80)+'</div><div style="font-weight:800;font-size:17px">hi, I\'m Housie 👋</div><div class="muted" style="font-size:13.5px">I\'ll listen to your game explanations and help you get ready</div>';
  root.appendChild(hero);
  const c=document.createElement('div'); c.className='card'; c.style.maxWidth='400px'; c.style.margin='14px auto 10px';
  c.innerHTML='<div style="font-weight:800;font-size:18px;margin-bottom:2px">sign in</div><div class="muted" style="font-size:13px;margin-bottom:12px">enter the phone number, name and PIN your admin gave you</div>';
  const ph=document.createElement('input'); ph.placeholder='phone number'; ph.type='tel';
  const nm=document.createElement('input'); nm.placeholder='your name';
  const pin=document.createElement('input'); pin.placeholder='4-digit PIN'; pin.type='password'; pin.maxLength=8;
  const er=document.createElement('div'); er.className='err'; if(msg){er.textContent=msg;er.style.display='block';}
  const b=document.createElement('button'); b.className='btn'; b.style.marginTop='8px'; b.style.width='100%'; b.textContent='sign in →';
  async function go(){
    b.disabled=true;b.textContent='signing in…';
    try{
      const r=await fetch(API+'/api/trainee/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:ph.value,name:nm.value,pin:pin.value})});
      const d=await r.json();
      if(!r.ok) throw new Error(d.detail||'Could not sign in.');
      TRAINEE={ name:d.name, phone:d.phone, category:d.category, cohort:d.cohort };
      localStorage.setItem(TK, d.token);
      localStorage.setItem('oh_trainee_info', JSON.stringify(TRAINEE));
      renderChecklist();
    }catch(e){ er.textContent=e.message; er.style.display='block'; b.disabled=false; b.textContent='sign in →'; }
  }
  b.onclick=go; pin.addEventListener('keydown',e=>{if(e.key==='Enter')go();});
  c.append(ph,nm,pin,er,b); root.appendChild(c);

  const adminLink=document.createElement('div'); adminLink.style.cssText='text-align:center;margin-top:14px';
  adminLink.innerHTML='<a href="dashboard.html" style="color:var(--muted);font-size:13px;font-weight:700;text-decoration:none">admin? sign in to the dashboard →</a>';
  root.appendChild(adminLink);
}

function speak(text){
  return new Promise(resolve=>{
    if(!('speechSynthesis' in window) || !text){ resolve(); return; }
    const u=new SpeechSynthesisUtterance(text);
    u.rate=0.98; u.onend=resolve; u.onerror=resolve;
    if(window.speechSynthesis.speaking || window.speechSynthesis.pending){
      window.speechSynthesis.cancel();
      setTimeout(()=>window.speechSynthesis.speak(u), 150);
    } else {
      window.speechSynthesis.speak(u);
    }
  });
}

function micSupported(){ return !!(window.SpeechRecognition||window.webkitSpeechRecognition); }

function categoryGames(){ return (window.GAMES||[]).filter(g=>g.category===TRAINEE.category); }

const GAME_ICONS={'match-me':'🎯','colour-flip':'🎨','shape-stitch':'🧵','shape-fusion':'🔷','cue-cards':'✏️','artventure':'🎲','imagine-that':'💭','doodle-dash':'⚡','art-gym-book':'📖'};
function gameIcon(id){ return GAME_ICONS[id]||'🧩'; }

function scoreTotal(s){ return ['age_appropriateness','clarity','gameplay_accuracy','challenge_accuracy','genuine'].reduce((n,k)=>n+(s[k]?1:0),0); }

const MAX_ATTEMPTS_PER_GAME=2; // original attempt + exactly one re-attempt

// latest attempt per game_id (records come back newest-first from the server)
function latestByGame(){
  const map={};
  MY_RECORDS.forEach(r=>{ if(!map[r.game_id]) map[r.game_id]=r; });
  return map;
}
function attemptCountByGame(){
  const counts={};
  MY_RECORDS.forEach(r=>{ counts[r.game_id]=(counts[r.game_id]||0)+1; });
  return counts;
}

async function fetchMyRecords(){
  const r=await fetch(API+'/api/my-explanations',{headers:authHeader()});
  if(r.status===401){ localStorage.removeItem(TK); loginView('Session expired — sign in again.'); return false; }
  MY_RECORDS = r.ok ? await r.json() : [];
  return true;
}

async function fetchMyStatus(){
  try{
    const r=await fetch(API+'/api/trainee/status',{headers:authHeader()});
    if(r.ok){ const d=await r.json(); TRAINEE.approved=!!d.approved; TRAINEE.category=d.category; TRAINEE.cohort=d.cohort; }
  }catch(e){}
}

async function renderChecklist(){
  root.innerHTML='<div class="empty">loading…</div>';
  const ok=await fetchMyRecords();
  if(!ok) return;
  await fetchMyStatus();
  const games=categoryGames();
  const latest=latestByGame();
  const attempts=attemptCountByGame();
  const doneCount=games.filter(g=>latest[g.id]).length;

  root.innerHTML='';
  const head=document.createElement('div'); head.className='card';
  const pct=games.length?Math.round(100*doneCount/games.length):0;
  head.innerHTML='<div style="display:flex;align-items:center;gap:14px">'
      +progressRingSVG(pct,64)
      +'<div style="flex:1"><div style="font-weight:800;font-size:18px;margin-bottom:2px">hi, '+esc(TRAINEE.name)+'</div>'
      +'<div class="muted" style="font-size:13px">'+esc(TRAINEE.category)+(TRAINEE.cohort?' · '+esc(TRAINEE.cohort):'')+'</div></div>'
    +'</div>'
    +'<div class="muted" style="font-size:13px;margin-top:10px">'+doneCount+' of '+games.length+' games completed. Every game is required — you can do them in any order. Each game allows one re-attempt.</div>';
  root.appendChild(head);

  if(!games.length){
    const empty=document.createElement('div'); empty.className='card empty'; empty.textContent='No games are set up for your category yet — check back soon.';
    root.appendChild(empty);
  }

  games.forEach(g=>{
    const rec=latest[g.id];
    const count=attempts[g.id]||0;
    const canReattempt=rec && count<MAX_ATTEMPTS_PER_GAME;
    const item=document.createElement('div'); item.className='checklist-item'+(rec?' done':'');
    const icon=document.createElement('div'); icon.className='game-icon'; icon.textContent=gameIcon(g.id);
    item.appendChild(icon);
    const dot=document.createElement('div'); dot.className='check-dot '+(rec?'done':'pending');
    dot.textContent=rec?'✓':'';
    item.appendChild(dot);
    const mid=document.createElement('div'); mid.style.flex='1';
    mid.innerHTML='<div style="font-weight:800;font-size:15px">'+esc(g.name)+'</div>'
      +(rec?'<div class="muted" style="font-size:12.5px">'+scoreTotal(rec.scores)+'/5 · ages '+esc(rec.age_band)+' · attempt '+count+' of '+MAX_ATTEMPTS_PER_GAME+'</div>':'<div class="muted" style="font-size:12.5px">not attempted yet</div>');
    item.appendChild(mid);
    if(!rec || canReattempt){
      const btn=document.createElement('button'); btn.className=rec?'ghost':'btn'; btn.style.flex='none';
      btn.textContent=rec?'re-attempt':'start →';
      btn.onclick=()=>startGame(g);
      item.appendChild(btn);
    } else {
      const done=document.createElement('span'); done.className='pill'; done.style.flex='none'; done.textContent='both attempts used';
      item.appendChild(done);
    }
    root.appendChild(item);
  });

  if(doneCount>0 && !TRAINEE.approved){
    const note=document.createElement('div'); note.className='muted'; note.style.cssText='font-size:12.5px;margin-bottom:10px';
    note.textContent='Your assessment will be available to download once your admin approves it.';
    root.appendChild(note);
  }
  const actions=document.createElement('div'); actions.style.cssText='display:flex;gap:8px;margin-top:4px';
  if(doneCount>0 && TRAINEE.approved){
    const dlBtn=document.createElement('button'); dlBtn.className='ghost'; dlBtn.style.flex='1'; dlBtn.textContent='⬇ download my assessment';
    dlBtn.onclick=()=>downloadAssessmentDocx(dlBtn);
    actions.appendChild(dlBtn);
  }
  const signout=document.createElement('button'); signout.className='ghost'; signout.style.flex='none'; signout.textContent='sign out';
  signout.onclick=()=>{ localStorage.removeItem(TK); localStorage.removeItem('oh_trainee_info'); loginView(); };
  actions.appendChild(signout);
  root.appendChild(actions);
}

function startGame(game){
  STATE.game=game;
  STATE.ageBand=Math.random()<0.5?'5–8':'8–12';
  STATE.history=[];
  STATE.finalResult=null;
  reviewMode=false; liveText=''; listening=false;
  if(recognition){ try{recognition.stop();}catch(e){} }
  renderIntro();
}

function renderIntro(){
  root.innerHTML='';
  const card=document.createElement('div'); card.className='card center';
  card.innerHTML='<div class="mascot" style="margin:0 auto 6px">'+mascotSVG(56)+'</div>'
    +'<span class="pill coral">'+esc(STATE.game.name)+'</span><span class="pill teal">ages '+esc(STATE.ageBand)+'</span>'
    +'<p style="margin-top:14px">Explain <b>'+esc(STATE.game.name)+'</b> out loud, as if you\'re briefing a group of children aged <b>'+esc(STATE.ageBand)+'</b>. Cover the goal, how to play, and how you\'d end it.</p>'
    +'<p style="font-weight:700;font-size:13.5px;color:var(--coral-dark)">Explain as you would to a child. Be clear and specific. Do not use any jargon.</p>'
    +'<p class="muted" style="font-size:13px">Tap the mic, speak your explanation, then tap "submit answer" when you\'re done. There\'ll be a couple of follow-up questions after.</p>';
  const btn=document.createElement('button'); btn.className='btn'; btn.textContent='I\'m ready →';
  btn.onclick=()=>{ renderConversation(); };
  card.appendChild(btn);
  const back=document.createElement('button'); back.className='ghost'; back.style.marginTop='10px'; back.textContent='← back to checklist';
  back.onclick=renderChecklist;
  card.appendChild(back);
  root.appendChild(card);
}

function renderConversation(waitingForModel){
  root.innerHTML='';
  const card=document.createElement('div'); card.className='card';
  card.innerHTML='<div style="margin-bottom:8px"><span class="pill coral">'+esc(STATE.game.name)+'</span><span class="pill teal">ages '+esc(STATE.ageBand)+'</span></div>';
  const log=document.createElement('div');
  STATE.history.forEach(h=>{
    const d=document.createElement('div'); d.className='turn '+(h.role==='trainee'?'trainee':'ai');
    const labIcon=h.role==='ai'?'<span style="display:inline-flex;vertical-align:middle;margin-right:4px">'+mascotSVG(16)+'</span>':'';
    d.innerHTML='<span class="lab">'+labIcon+(h.role==='trainee'?esc(TRAINEE.name||'you'):'Housie')+'</span>'+esc(h.text);
    if(h.role==='ai'){
      const replay=document.createElement('button'); replay.className='ghost'; replay.style.cssText='margin-top:6px;font-size:11px;padding:5px 11px';
      replay.textContent='🔊 replay'; replay.onclick=()=>speak(h.text);
      d.appendChild(replay);
    }
    log.appendChild(d);
  });
  card.appendChild(log);

  if(waitingForModel){
    const w=document.createElement('div'); w.className='muted center'; w.style.margin='14px 0';
    w.innerHTML='<div class="mascot" style="margin:0 auto 4px;animation:pulse 1.2s infinite;border-radius:50%">'+mascotSVG(32)+'</div>Housie is thinking…';
    card.appendChild(w); root.appendChild(card); return;
  }

  if(reviewMode){
    const label=document.createElement('div'); label.className='muted'; label.style.cssText='font-size:12px;font-weight:700;margin-top:10px';
    label.textContent='review & fix the transcript before submitting — speech recognition isn\'t perfect';
    card.appendChild(label);
    const ta=document.createElement('textarea'); ta.id='reviewBox'; ta.value=liveText.trim();
    ta.style.minHeight='90px';
    ta.addEventListener('paste', e=>e.preventDefault());
    ta.addEventListener('drop', e=>e.preventDefault());
    card.appendChild(ta);
    const row=document.createElement('div'); row.style.cssText='display:flex;gap:8px';
    const rerecord=document.createElement('button'); rerecord.className='ghost'; rerecord.textContent='🎙 re-record instead';
    rerecord.onclick=()=>{ reviewMode=false; liveText=''; originalTranscript=''; renderConversation(); };
    const submitBtn=document.createElement('button'); submitBtn.className='btn'; submitBtn.style.flex='1'; submitBtn.textContent='submit answer';
    submitBtn.onclick=()=>submitAnswer(ta.value, originalTranscript);
    row.append(rerecord,submitBtn);
    card.appendChild(row);
    root.appendChild(card);
    return;
  }

  const live=document.createElement('div'); live.className='live'; live.id='liveText';
  card.appendChild(live);

  const mic=document.createElement('button'); mic.className='mic'; mic.id='micBtn'; mic.textContent='🎙';
  mic.onclick=toggleListening;
  const wrap=document.createElement('div'); wrap.className='center'; wrap.appendChild(mic);
  card.appendChild(wrap);

  const hint=document.createElement('div'); hint.className='muted center'; hint.style.fontSize='12px';
  hint.textContent='tap to speak, tap again when done — you\'ll get a chance to review the text first';
  card.appendChild(hint);

  root.appendChild(card);
}

function toggleListening(){
  if(listening){ stopListening(); return; }
  const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new Rec();
  recognition.continuous=true; recognition.interimResults=true; recognition.lang='en-IN';
  liveText='';
  recognition.onresult=(e)=>{
    let interim='', final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal) final+=t+' '; else interim+=t;
    }
    if(final) liveText+=final;
    const lt=document.getElementById('liveText');
    if(lt) lt.textContent=liveText+interim;
  };
  recognition.onerror=()=>{ stopListening(); };
  recognition.onend=()=>{
    listening=false;
    if(liveText.trim()){ originalTranscript=liveText.trim(); reviewMode=true; renderConversation(); }
    else { const m=document.getElementById('micBtn'); if(m) m.classList.remove('listening'); }
  };
  recognition.start();
  listening=true;
  const m=document.getElementById('micBtn'); if(m) m.classList.add('listening');
}
function stopListening(){
  if(recognition){ try{recognition.stop();}catch(e){} }
  listening=false;
}

async function submitAnswer(rawText, original){
  const text=(rawText||'').trim();
  if(!text) return;
  reviewMode=false;
  const turn={role:'trainee', text};
  if(original && original.trim() && original.trim()!==text) turn.original=original.trim();
  STATE.history.push(turn);
  renderConversation(true);
  try{
    const r=await fetch(API+'/api/explain/turn',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeader()),
      body:JSON.stringify({game:STATE.game, age_band:STATE.ageBand, history:STATE.history})});
    if(r.status===401){ localStorage.removeItem(TK); loginView('Session expired — sign in again.'); return; }
    const d=await r.json();
    if(!r.ok){
      STATE.history.push({role:'ai', text:'⚠ server error: '+(d.detail||('HTTP '+r.status))});
      renderConversation();
      return;
    }
    if(d.action==='final'){
      STATE.finalResult=d;
      renderFinal();
    } else {
      STATE.history.push({role:'ai', text:d.question||('What materials would you need to run '+STATE.game.name+'?')});
      renderConversation();
      await speak(d.question||'');
    }
  }catch(e){
    STATE.history.push({role:'ai', text:'(connection error — could not reach the scoring service)'});
    renderConversation();
  }
}

function renderFinal(){
  root.innerHTML='';
  const s=(STATE.finalResult||{}).scores||{};
  const total=scoreTotal(s);
  const card=document.createElement('div'); card.className='card center';
  card.innerHTML='<div class="mascot" style="margin:0 auto 4px">'+mascotSVG(total===5?64:48)+'</div>'
    +(total===5?'<div style="font-size:13px;font-weight:800;color:var(--sage)">perfect score! 🎉</div>':'')
    +'<div style="font-weight:800;font-size:17px;margin:4px 0 6px">result — '+esc(STATE.game.name)+'</div>'
    +'<div class="badge-total">'+total+' / 5</div>'
    +'<div class="scorebar center" style="justify-content:center">'
      +'<span class="sc '+(s.age_appropriateness?'yes':'no')+'">'+(s.age_appropriateness?'✓':'✗')+' age fit (ages '+esc(STATE.ageBand)+')</span>'
      +'<span class="sc '+(s.clarity?'yes':'no')+'">'+(s.clarity?'✓':'✗')+' clarity</span>'
      +'<span class="sc '+(s.gameplay_accuracy?'yes':'no')+'">'+(s.gameplay_accuracy?'✓':'✗')+' gameplay accuracy</span>'
      +'<span class="sc '+(s.challenge_accuracy?'yes':'no')+'">'+(s.challenge_accuracy?'✓':'✗')+' challenge accuracy</span>'
      +'<span class="sc '+(s.genuine?'yes':'no')+'">'+(s.genuine?'✓':'✗')+' genuine</span>'
    +'</div>'
    +(STATE.finalResult.reasoning?'<div class="muted" style="font-size:13.5px;margin-bottom:12px;text-align:left">'+esc(STATE.finalResult.reasoning)+'</div>':'')
    +(STATE.finalResult.suggestion?'<div class="feedback-box" style="margin-bottom:12px;text-align:left"><div class="ft">🎯 from Housie</div><div style="font-size:13.5px">'+esc(STATE.finalResult.suggestion)+'</div></div>':'')
    +(STATE.finalResult.new_idea?'<div class="feedback-box" style="margin-bottom:12px;text-align:left"><div class="ft">💡 new idea from '+esc(TRAINEE.name||'you')+'</div><div style="font-size:13.5px">'+esc(STATE.finalResult.new_idea)+'</div></div>':'');
  const saveBtn=document.createElement('button'); saveBtn.className='btn'; saveBtn.style.width='100%'; saveBtn.textContent='save & back to checklist';
  saveBtn.onclick=async()=>{
    saveBtn.disabled=true; saveBtn.textContent='saving…';
    try{
      const r=await fetch(API+'/api/explain/save',{method:'POST',headers:Object.assign({'Content-Type':'application/json'},authHeader()),body:JSON.stringify({
        game_id:STATE.game.id, game_name:STATE.game.name, age_band:STATE.ageBand, trainee_name:TRAINEE.name,
        history:STATE.history, scores:s, reasoning:STATE.finalResult.reasoning||'', new_idea:STATE.finalResult.new_idea||null, suggestion:STATE.finalResult.suggestion||''
      })});
      if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||'could not save'); }
      renderChecklist();
    }catch(e){ saveBtn.textContent=e.message||'could not save — try again'; saveBtn.disabled=false; }
  };
  card.appendChild(saveBtn);
  root.appendChild(card);
}

async function downloadAssessmentDocx(btn){
  const orig=btn.textContent;
  btn.disabled=true; btn.textContent='preparing…';
  try{
    const r=await fetch(API+'/api/my-assessment.docx',{headers:authHeader()});
    if(!r.ok){ const d=await r.json().catch(()=>({})); throw new Error(d.detail||'could not generate the document'); }
    const blob=await r.blob();
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    const cd=r.headers.get('Content-Disposition')||'';
    const m=cd.match(/filename="([^"]+)"/);
    a.download=m?m[1]:(TRAINEE.name.replace(/[^a-z0-9]+/gi,'-')+'-assessment.docx');
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    btn.textContent=orig;
  }catch(e){
    btn.textContent='could not download — try again';
  }
  btn.disabled=false;
}

const savedInfo=localStorage.getItem('oh_trainee_info');
if(savedInfo){ try{ TRAINEE=JSON.parse(savedInfo); }catch(e){} }
if(!localStorage.getItem(TK)) loginView(); else renderChecklist();
</script>
</body>
</html>
